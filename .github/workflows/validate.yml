name: Validate skin

on:
  pull_request:
  push:
    branches:
      - PiersPort
      - piers
      - omega
      - omega-scope
      - omega-21to9
      - omega-4to3
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Standard library only — no pip, no Kodi, no build step. Runs in about a second.
      # Catches the failures Kodi itself reports silently or not at all: dangling
      # <include>/$VAR names, include names defined twice, and translations whose
      # source string has moved on without them.
      #
      # Translation findings are advisory and never fail the build — they are fixed
      # in Weblate, and a hand-edit here is overwritten on the next sync.
      - name: Reference integrity and translation drift
        run: python3 .github/scripts/validate_skin.py .
